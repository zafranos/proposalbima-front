<!doctype html>
<html lang="id">
<head>
<!--@head-->
<title>Tambah skema | Proposal DIKTI</title>
</head>
<body class="bg-background text-foreground antialiased">
  <!--@include app-bar-->
  <main id="main" class="mx-auto w-full max-w-lg px-4 pb-16 pt-10 sm:pt-14">
    <div class="animate-rise">
          <h1 class="font-display text-4xl font-medium tracking-tight">Tambah skema</h1>
          <p id="intro" class="mt-2 text-[15px] text-muted-foreground-1">Pilih skema yang belum Anda ikuti. Kode undangan membuka akses penuh selama masa trial.</p>
          <form id="form" method="post" class="card card-pad mt-8 space-y-5" novalidate>
            <div id="form-error" role="alert" class="alert alert-error hidden"></div>
            <fieldset>
              <legend class="label">Skema</legend>
              <div id="skema-list" class="grid gap-3" role="radiogroup" aria-label="Skema"><p class="text-sm text-muted-foreground-1">Memuat skema...</p></div>
            </fieldset>
            <div>
              <label for="invite_code" class="label">Kode undangan <span class="font-normal text-muted-foreground-1">(opsional)</span></label>
              <input id="invite_code" name="invite_code" type="text" autocomplete="off" autocapitalize="characters" class="input">
            </div>
            <button id="submit" type="submit" class="btn btn-primary btn-lg w-full">Tambah skema</button>
          </form>
          <p class="mt-6 text-center text-sm"><a href="/select-skema/" class="link">Kembali</a></p>
    </div>
  </main>
  <script type="module" src="/assets/js/pages/enroll.js"></script>
</body>
</html>
