<!doctype html>
<html lang="id">
<head>
<!--@head-->
<title>Masuk | Proposal DIKTI</title>
</head>
<body class="min-h-screen bg-background-1 text-foreground antialiased">
  <header class="mx-auto flex max-w-3xl items-center justify-between px-4 py-3">
    <a href="/" class="text-lg font-semibold">Proposal DIKTI</a>
    <div class="flex items-center gap-2">
      
      <button type="button" data-theme-toggle class="inline-flex size-9 items-center justify-center rounded-lg border border-line-2 hover:bg-muted-hover focus:outline-none focus:ring-2 focus:ring-primary-focus"></button>
    </div>
  </header>
  <main class="mx-auto max-w-md px-4 pb-16 pt-6">
    <div class="rounded-xl border border-layer-line bg-layer p-6 shadow-sm sm:p-8">
      <h1 class="text-2xl font-bold">Masuk</h1>
      <p id="notice" role="status" class="hidden rounded-lg border border-red-300 bg-red-50 px-3 py-2 text-sm text-red-900 dark:border-red-700 dark:bg-red-950 dark:text-red-100 mt-4"></p>
      <form id="form" class="mt-6 space-y-4" novalidate>
        <div id="form-error" role="alert" class="hidden rounded-lg border border-red-300 bg-red-50 px-3 py-2 text-sm text-red-900 dark:border-red-700 dark:bg-red-950 dark:text-red-100"></div>
        <div>
          <label for="email" class="mb-1.5 block text-sm font-medium">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required class="block w-full rounded-lg border border-line-3 bg-layer px-3.5 py-2.5 text-sm text-layer-foreground placeholder:text-muted-foreground-1 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30 disabled:opacity-50">
        </div>
        <div>
          <label for="password" class="mb-1.5 block text-sm font-medium">Kata sandi</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required class="block w-full rounded-lg border border-line-3 bg-layer px-3.5 py-2.5 text-sm text-layer-foreground placeholder:text-muted-foreground-1 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30 disabled:opacity-50">
        </div>
        <button id="submit" type="submit" class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-primary px-4 py-2.5 text-sm font-medium text-primary-foreground hover:bg-primary-hover focus:outline-none focus:ring-2 focus:ring-primary-focus focus:ring-offset-2 disabled:opacity-50">Masuk</button>
      </form>
      <p class="mt-4 text-sm"><a href="/forgot-password/" class="font-medium text-primary-700 hover:underline dark:text-primary-300">Lupa kata sandi?</a></p>
    </div>
    <p class="mt-6 text-center text-sm text-muted-foreground-1">Belum punya akun? <a href="/register/" class="font-medium text-primary-700 hover:underline dark:text-primary-300">Daftar</a></p>
  </main>
  <script type="module" src="/assets/js/pages/login.js"></script>
</body>
</html>
