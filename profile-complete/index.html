<!doctype html>
<html lang="id">
<head>
<!--@head-->
<title>Lengkapi profil | Proposal DIKTI</title>
</head>
<body class="bg-background text-foreground antialiased">
  <!--@include app-bar-->
  <main id="main" class="mx-auto w-full max-w-lg px-4 pb-16 pt-10 sm:pt-14">
    <div class="animate-rise">
          <ol class="mb-8 flex items-center gap-3 text-sm" aria-label="Langkah awal">
            <li class="flex items-center gap-2 font-semibold" aria-current="step"><span class="grid size-7 place-items-center rounded-full bg-primary text-xs text-primary-foreground">1</span>Profil</li>
            <li class="h-px flex-1 bg-line-3" aria-hidden="true"></li>
            <li class="flex items-center gap-2 text-muted-foreground-1"><span class="grid size-7 place-items-center rounded-full border border-line-3 text-xs">2</span><span class="sr-only sm:not-sr-only">Skema</span></li>
            <li class="h-px flex-1 bg-line-3" aria-hidden="true"></li>
            <li class="flex items-center gap-2 text-muted-foreground-1"><span class="grid size-7 place-items-center rounded-full border border-line-3 text-xs">3</span><span class="sr-only sm:not-sr-only">Akses</span></li>
          </ol>
          <h1 class="font-display text-4xl font-medium tracking-tight">Lengkapi profil</h1>
          <p class="mt-2 text-[15px] text-muted-foreground-1">Afiliasi atau institusi diperlukan sebelum Anda memilih skema.</p>
          <form id="form" method="post" class="card card-pad mt-8 space-y-5" novalidate>
            <div id="form-error" role="alert" class="alert alert-error hidden"></div>
            <div>
              <label for="name" class="label">Nama lengkap</label>
              <input id="name" name="name" type="text" autocomplete="name" required class="input">
            </div>
            <div>
              <label for="affiliation" class="label">Afiliasi atau institusi</label>
              <input id="affiliation" name="affiliation" type="text" autocomplete="organization" required class="input">
            </div>
            <button id="submit" type="submit" class="btn btn-primary btn-lg w-full">Simpan dan lanjut</button>
          </form>
    </div>
  </main>
  <script type="module" src="/assets/js/pages/profile-complete.js"></script>
</body>
</html>
