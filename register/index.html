<!doctype html>
<html lang="id">
<head>
<!--@head-->
<title>Daftar | Proposal DIKTI</title>
</head>
<body class="bg-background text-foreground antialiased">
  <div class="grid min-h-screen lg:grid-cols-[5fr_6fr]">
    <!--@include auth-aside-->
    <div class="flex min-h-screen flex-col">
      <header class="flex items-center justify-between px-4 py-4 sm:px-8">
        <span class="lg:hidden"><!--@include logo--></span><span class="hidden lg:block"></span>
        <!--@include theme-toggle-->
      </header>
      <main id="main" class="flex flex-1 items-center justify-center px-4 pb-14 pt-4 sm:px-8">
        <div class="w-full max-w-md animate-rise">
          <h1 class="font-display text-4xl font-medium tracking-tight">Buat akun</h1>
          <p class="mt-2 text-[15px] text-muted-foreground-1">Akun baru menunggu persetujuan admin; dengan kode undangan, akun langsung disetujui.</p>
          <form id="form" method="post" class="mt-8 space-y-5" novalidate>
            <div id="form-error" role="alert" class="alert alert-error hidden"></div>
            <div>
              <label for="name" class="label">Nama lengkap</label>
              <input id="name" name="name" type="text" autocomplete="name" required class="input">
            </div>
            <div>
              <label for="email" class="label">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" required class="input">
            </div>
            <div>
              <label for="password" class="label">Kata sandi</label>
              <input id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-hint" class="input">
            <p id="password-hint" class="hint">8 sampai 72 karakter.</p>
            </div>
            <div>
              <label for="affiliation" class="label">Afiliasi atau institusi</label>
              <input id="affiliation" name="affiliation" type="text" autocomplete="organization" required class="input">
            </div>
            <fieldset>
              <legend class="label">Skema penelitian</legend>
              <div id="skema-list" class="grid gap-3" role="radiogroup" aria-label="Skema penelitian"><p class="text-sm text-muted-foreground-1">Memuat skema...</p></div>
            </fieldset>
            <div>
              <label for="invite_code" class="label">Kode undangan <span class="font-normal text-muted-foreground-1">(opsional)</span></label>
              <input id="invite_code" name="invite_code" type="text" autocomplete="off" autocapitalize="characters" class="input">
            </div>
            <button id="submit" type="submit" class="btn btn-primary btn-lg w-full">Buat akun</button>
          </form>
          <p class="mt-8 border-t border-line-2 pt-6 text-sm text-muted-foreground-1">Sudah punya akun? <a href="/login/" class="link">Masuk</a></p>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="/assets/js/pages/register.js"></script>
</body>
</html>
