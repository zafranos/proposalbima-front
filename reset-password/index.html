<!doctype html>
<html lang="id">
<head>
<!--@head-->
<title>Buat kata sandi baru | Proposal DIKTI</title>
</head>
<body class="bg-background text-foreground antialiased">
  <div class="grid min-h-screen lg:grid-cols-[5fr_6fr]">
    <!--@include auth-aside-->
    <div class="flex min-h-screen flex-col">
      <header class="flex items-center justify-between px-4 py-4 sm:px-8">
        <span class="lg:hidden"><!--@include logo--></span><span class="hidden lg:block"></span>
        <!--@include theme-toggle-->
      </header>
      <main id="main" class="flex flex-1 items-center justify-center px-4 pb-14 pt-4 sm:px-8">
        <div class="w-full max-w-md animate-rise">
          <h1 class="font-display text-4xl font-medium tracking-tight">Buat kata sandi baru</h1>
          <div id="result" role="status" class="alert alert-success mt-6 hidden"></div>
          <form id="form" method="post" class="mt-8 space-y-5" novalidate>
            <div id="form-error" role="alert" class="alert alert-error hidden"></div>
            <div>
              <label for="password" class="label">Kata sandi baru</label>
              <input id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-hint" class="input">
            <p id="password-hint" class="hint">8 sampai 72 karakter.</p>
            </div>
            <div>
              <label for="password2" class="label">Ulangi kata sandi baru</label>
              <input id="password2" name="password2" type="password" autocomplete="new-password" required class="input">
            </div>
            <button id="submit" type="submit" class="btn btn-primary btn-lg w-full">Simpan kata sandi</button>
          </form>
          <p class="mt-8 border-t border-line-2 pt-6 text-sm"><a href="/forgot-password/" class="link">Minta tautan baru</a></p>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="/assets/js/pages/reset-password.js"></script>
</body>
</html>
