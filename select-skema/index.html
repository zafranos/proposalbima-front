<!doctype html>
<html lang="id">
<head>
<!--@head-->
<title>Pilih skema | Proposal DIKTI</title>
</head>
<body class="bg-background text-foreground antialiased">
  <!--@include app-bar-->
  <main id="main" class="mx-auto w-full max-w-lg px-4 pb-16 pt-10 sm:pt-14">
    <div class="animate-rise">
          <ol class="mb-8 flex items-center gap-3 text-sm" aria-label="Langkah awal">
            <li class="flex items-center gap-2 text-muted-foreground-1"><span class="grid size-7 place-items-center rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300"><!--@icon check | size-4--></span><span class="sr-only sm:not-sr-only">Profil</span></li>
            <li class="h-px flex-1 bg-line-3" aria-hidden="true"></li>
            <li class="flex items-center gap-2 font-semibold" aria-current="step"><span class="grid size-7 place-items-center rounded-full bg-primary text-xs text-primary-foreground">2</span>Skema</li>
            <li class="h-px flex-1 bg-line-3" aria-hidden="true"></li>
            <li class="flex items-center gap-2 text-muted-foreground-1"><span class="grid size-7 place-items-center rounded-full border border-line-3 text-xs">3</span><span class="sr-only sm:not-sr-only">Akses</span></li>
          </ol>
          <h1 class="font-display text-4xl font-medium tracking-tight">Pilih skema</h1>
          <p class="mt-2 text-[15px] text-muted-foreground-1">Pilih skema yang ingin Anda kerjakan sekarang. Anda bisa menggantinya kapan saja.</p>
          <div id="error" role="alert" class="alert alert-error mt-5 hidden"></div>
          <div id="list" class="mt-8 space-y-3"><p class="text-sm text-muted-foreground-1">Memuat...</p></div>
          <p class="mt-8 border-t border-line-2 pt-6 text-sm"><a href="/enroll/" class="link">Tambah skema lain</a></p>
    </div>
  </main>
  <script type="module" src="/assets/js/pages/select-skema.js"></script>
</body>
</html>
